# Entorno local del hito (10 de octubre de 2026) — documento 14, sección 8.
# El API, la web y la app NO van aquí: corren en la computadora de cada integrante.
# Uso: docker compose -f docker-compose.dev.yml up -d

name: villa-serena-dev

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.31
    restart: unless-stopped
    environment:
      MP_DATABASE: /data/mailpit.db
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Interfaz web
    volumes:
      - mailpit-data:/data

  # Las imágenes oficiales minio/minio y minio/mc ya no se publican en Docker Hub;
  # se usa el fork comunitario pgsty (mismo MinIO, API compatible con S3).
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000" # API S3
      - "9001:9001" # Consola
    volumes:
      - minio-data:/data

  # Servicio de inicio: crea los dos buckets y termina.
  minio-init:
    image: pgsty/mc:RELEASE.2026-09-13T00-00-00Z
    depends_on:
      - minio
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_PUBLIC: ${MINIO_BUCKET_PUBLIC}
      MINIO_BUCKET_PRIVATE: ${MINIO_BUCKET_PRIVATE}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\"; do
        echo 'Esperando a MinIO...'; sleep 2;
      done;
      mc mb --ignore-existing local/$${MINIO_BUCKET_PUBLIC};
      mc mb --ignore-existing local/$${MINIO_BUCKET_PRIVATE};
      mc anonymous set download local/$${MINIO_BUCKET_PUBLIC};
      mc anonymous set none local/$${MINIO_BUCKET_PRIVATE};
      echo 'Buckets listos.'
      "

  prometheus:
    image: prom/prometheus:v3.13.4
    restart: unless-stopped
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway" # Necesario en Linux
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:13.0.10
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3001:3000" # El 3000 de la computadora es de la web
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  postgres-data:
  mailpit-data:
  minio-data:
  prometheus-data:
  grafana-data:
