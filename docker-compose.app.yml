# Stack de aplicación: PostgreSQL + API (Spring Boot) + Web (Next.js).
# Es independiente de docker-compose.dev.yml (Mailpit, MinIO, Prometheus, Grafana).
# Requiere los repos hermanos ../api y ../web, cada uno con su Dockerfile.
# Uso: docker compose -f docker-compose.app.yml up -d --build

name: villa-serena-app

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - villa-serena-net

  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-demo}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGENES: http://localhost:3000
      WEB_URL: http://localhost:3000
      DEMO_PASSWORD_HASH: ${DEMO_PASSWORD_HASH}
      CANAL1_KEY_HASH: ${CANAL1_KEY_HASH}
      CANAL2_KEY_HASH: ${CANAL2_KEY_HASH}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - villa-serena-net

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
      args:
        # Se incrusta en el JS del navegador al compilar: es la URL que el
        # navegador (no el contenedor) usa para llegar al API.
        NEXT_PUBLIC_WS_URL: ws://localhost:8080/ws
    restart: unless-stopped
    environment:
      API_URL: http://api:8080
      STAFF_AUTH_MODE: ${STAFF_AUTH_MODE:-demo}
      VILLA_SERENA_BFF_MODE: ${VILLA_SERENA_BFF_MODE:-demo}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - villa-serena-net

volumes:
  postgres-data:

networks:
  villa-serena-net:
    driver: bridge
