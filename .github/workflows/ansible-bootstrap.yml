name: Ansible EC2 Bootstrap

on:
  pull_request:
    paths:
      - "ansible/**"
      - ".github/workflows/ansible-bootstrap.yml"
  push:
    branches: [main]
    paths:
      - "ansible/**"
      - ".github/workflows/ansible-bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Ansible
        run: python -m pip install 'ansible-core>=2.17,<2.21'
      - name: Install AWS collection
        run: ansible-galaxy collection install -r ansible/requirements.yml
      - name: Syntax check
        run: ansible-playbook -i 'localhost,' -c local ansible/playbooks/bootstrap.yml --syntax-check

  bootstrap:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: villa-serena-ec2-bootstrap
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_INFRA_ANSIBLE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Install Session Manager plugin
        run: |
          curl -fsSL https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb -o /tmp/session-manager-plugin.deb
          sudo dpkg -i /tmp/session-manager-plugin.deb
      - name: Install Ansible and AWS Python SDK
        run: python -m pip install 'ansible-core>=2.17,<2.21' 'boto3>=1.35' 'botocore>=1.35'
      - name: Install AWS collection
        run: ansible-galaxy collection install -r ansible/requirements.yml
      - name: Run Debian bootstrap via SSM
        env:
          INSTANCE_ID: ${{ vars.AWS_EC2_INSTANCE_ID }}
          S3_BUCKET: ${{ vars.AWS_SSM_TRANSFER_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          : "${INSTANCE_ID:?Set AWS_EC2_INSTANCE_ID}"
          : "${S3_BUCKET:?Set AWS_SSM_TRANSFER_BUCKET}"
          : "${AWS_REGION:?Set AWS_REGION}"
          ansible-playbook -i "${INSTANCE_ID}," ansible/playbooks/bootstrap.yml \
            -e "ansible_connection=amazon.aws.aws_ssm" \
            -e "ansible_aws_ssm_bucket_name=${S3_BUCKET}" \
            -e "ansible_aws_ssm_region=${AWS_REGION}"
