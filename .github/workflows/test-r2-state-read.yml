name: Test R2 Terraform state read

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/test-r2-state-read.yml"

permissions:
  contents: read

jobs:
  read-state:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root:
          - aws/networking
          - aws/compute
          - aws/identity
          - aws/gateway
          - aws/storage
          - cloudflare/storage
          - cloudflare/dns
          - github
    defaults:
      run:
        working-directory: ${{ matrix.root }}
    env:
      AWS_SHARED_CREDENTIALS_FILE: /dev/null
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.4"
      - name: Read remote state from R2
        run: |
          terraform init -input=false -reconfigure -backend-config="profile=" -get=false
          terraform state list
