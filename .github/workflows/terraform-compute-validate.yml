name: Terraform Compute Validation

on:
  pull_request:
    paths:
      - "aws/compute/**"
      - ".github/workflows/terraform-compute-validate.yml"
  push:
    branches: [main]
    paths:
      - "aws/compute/**"
      - ".github/workflows/terraform-compute-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aws/compute
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.4"
      - name: Check formatting
        run: terraform fmt -check -recursive -diff
      - name: Initialize provider without backend
        run: terraform init -backend=false -input=false
      - name: Validate configuration
        run: terraform validate -no-color
